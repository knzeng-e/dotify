[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DOTIFY_DEPLOYMENT = "production"
  VITE_DOTIFY_HOST_MODE = "off"
  VITE_SIGNAL_URL = "https://dotify-signal.fly.dev"
  VITE_DOTIFY_API_URL = "https://dotify-api.fly.dev"
  VITE_PINATA_GATEWAY = "https://gateway.pinata.cloud"
  VITE_IPFS_READ_GATEWAYS = "https://ipfs.io,https://dweb.link,https://paseo-ipfs.polkadot.io"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
