app = "dotify-signal"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.signal"

[env]
  SIGNAL_PORT = "8788"
  SIGNAL_HOST = "0.0.0.0"
  SIGNAL_ROOM_TTL_MS = "21600000"
  SIGNAL_HOST_TIMEOUT_MS = "120000"
  SIGNAL_MAX_LISTENERS = "24"
  SIGNAL_TURN_CAPABILITY_TTL_MS = "120000"
  SIGNAL_CONTRIBUTION_RPC_URL = "https://eth-rpc-testnet.polkadot.io/"
  SIGNAL_CONTRIBUTION_CHAIN_ID = "420420417"
  SIGNAL_CONTRIBUTION_DIRECTORY = "0x4e883827d61e573094c7b777bae323070ea9f954"
  SIGNAL_CONTRIBUTION_API_URL = "https://dotify-api.fly.dev/api"
  # SIGNAL_TURN_CAPABILITY_SECRET is a Fly secret shared with the API app as
  # TURN_CAPABILITY_SECRET. Never track its value here.
  # SIGNAL_CONTRIBUTION_ATTESTOR_KEY is a dedicated Fly secret. Its public
  # address must be approved in the artist contribution policy before room tips.
  # Polkadot Desktop/native hosts can omit Origin on Socket.IO handshakes.
  # Keep literal Origin: null rejected; this only permits a missing header.
  SIGNAL_ALLOW_MISSING_ORIGIN = "true"
  # Keep all observed Product host origins: the public dev-dot.li gateway, the
  # app.dev-dot.li and app.dot.li execution iframes, the mobile host's dot
  # pseudo-domain, and the native/custom scheme variants observed in Product
  # mobile.
  SIGNAL_ORIGINS = "https://muzinga.netlify.app,https://dotify-test01.dev-dot.li,https://dotify-test01.app.dev-dot.li,https://dotify-test01.app.dot.li,https://dotify-test01.dot,polkadot://dotify-test01.dot,polkadot://app.dotify-test01.dot"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
