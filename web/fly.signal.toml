app = "dotify-signal"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.signal"

[env]
  SIGNAL_PORT = "8788"
  SIGNAL_HOST = "0.0.0.0"
  SIGNAL_ROOM_TTL_MS = "21600000"
  SIGNAL_HOST_TIMEOUT_MS = "120000"
  SIGNAL_MAX_LISTENERS = "24"
  # Keep the public DotNS gateway and the Product host's HTTPS app iframe: the
  # top-level URL is dev-dot.li, but browser requests originate from app.dev-dot.li.
  SIGNAL_ORIGINS = "https://muzinga.netlify.app,https://dotify-test01.dev-dot.li,https://dotify-test01.app.dev-dot.li,polkadot://app.dotify-test01.dot"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
