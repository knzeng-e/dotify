app = "dotify-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # Activation requires the W36 offline import and private custody service.
  # See docs/operations/shared-api-state.md; no automatic state initialization.
  STATE_STORE = "postgres"
  STATE_NAMESPACE = "dotify"
  API_ROLE = "edge"
  CUSTODY_SERVICE_URL = "http://dotify-custody.internal:8790"
  # Fresh attested Paseo deployment. Keep aligned with deployments.json and
  # web/src/shared/config/deploymentSafety.ts so API diagnostics and access
  # checks target the owner-guarded factory/directory pair.
  API_PORT = "8790"
  NODE_ENV = "production"
  # Exact frontend origins reach this API: Netlify, the public DotNS gateway,
  # observed Product host HTTPS execution origins, and the native host custom
  # scheme.
  # Keep this in step with SIGNAL_ORIGINS in web/fly.signal.toml.
  #
  # `polkadot:` is a non-special scheme, so `new URL(...).origin` is opaque and
  # a browser may send `Origin: null` instead of the literal value below. If a
  # host request is still refused, read the actual Origin header off the Fly log
  # before widening this list - never add a bare `null`, which would admit every
  # sandboxed iframe and file:// page on the web to authenticated upload and
  # content-key routes.
  API_ORIGINS = "https://muzinga.netlify.app,https://dotify-test01.dev-dot.li,https://dotify-test01.app.dev-dot.li,https://dotify-test01.app.dot.li,https://dotify-test01.dot,polkadot://dotify-test01.dot,polkadot://app.dotify-test01.dot"
  PASEO_ASSET_HUB_RPC = "https://eth-rpc-testnet.polkadot.io/"
  # Archive reads for finalized native receipts; never used for signing.
  PASEO_ASSET_HUB_NATIVE_RPC = "https://asset-hub-paseo-rpc.n.dwellir.com"
  # Fly forwards every request from its proxy; key rate limits on Fly-Client-IP.
  API_TRUST_PROXY = "fly"
  DOTIFY_FACTORY_ADDRESS = "0x61dd19a0d4f6bd21c6ffa4a7a9d9e771af95bb13"
  DOTIFY_DIRECTORY_ADDRESS = "0x79b21cad3848a3019edee17b089142282f4a13a3"
  DOTIFY_CHAIN_ID = "420420417"
  # New publications use the isolated private encoder after explicit custody
  # provisioning. STREAMING_WORKER_TOKEN is a dedicated Fly secret, never the
  # content-key master or a frontend variable.
  # TURN_CAPABILITY_SECRET is a Fly secret shared with the signaling app as
  # SIGNAL_TURN_CAPABILITY_SECRET. Never track its value here.

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep both shared-state replicas warm. A stopped machine cold-starts on the first content
  # key request, and that request sits directly in front of first sound: a
  # measured 8.2s to /health cold against 0.11s warm. Scaling to zero saves
  # nothing a listener would trade eight silent seconds for.
  min_machines_running = 2
  # Public replicas share trust/catalog state. Encrypted publication files and
  # verified receipt writes remain on the private single-writer custody service.
  max_machines_running = 2
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"
