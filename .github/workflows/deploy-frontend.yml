name: Validate Product candidate

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Product bundle profile to validate
        type: choice
        required: true
        default: validation
        options:
          - validation
          - release
      expected-sha:
        description: Full commit SHA that must be checked out and embedded
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: validate-product-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build without signing authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs['expected-sha'] }}

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs['expected-sha'] }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs['expected-sha'] }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Read Product executable identity
        id: product-identity
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const config = readFileSync('polkadot-app-deploy.config.ts', 'utf8');
          const match = config.match(/appVersion\s*:\s*\[([^\]]+)\]/m);
          if (!match) throw new Error('Product executable appVersion is missing');

          const tokens = match[1].split(',').map(part => part.trim());
          if (tokens.length === 0 || tokens.some(token => !/^(?:0|[1-9][0-9]*)$/.test(token))) {
            throw new Error('Product executable appVersion is invalid');
          }

          const parts = tokens.map(Number);
          if (parts.some(part => !Number.isSafeInteger(part))) throw new Error('Product executable appVersion is unsafe');

          appendFileSync(process.env.GITHUB_OUTPUT, `app-version=[${parts.join(', ')}]\n`);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Validate candidate
        working-directory: web
        run: |
          npm run test:unit
          npm run smoke:production-env
          npm run smoke:devnet
          npm run smoke:product-journey -- --md-out /tmp/product-journey.md --json-out /tmp/product-journey.json

      - name: Build validation profile
        if: inputs.profile == 'validation'
        working-directory: web
        env:
          VITE_DOTIFY_RUNTIME_ADAPTER: product-cdm
          VITE_DOTIFY_ARTIST_DONATIONS: on
          VITE_DOTIFY_DEBUG_PANEL: 'true'
        run: npm run build:product-devnet:frozen

      - name: Build release profile
        if: inputs.profile == 'release'
        working-directory: web
        run: npm run build:product-devnet:frozen

      - name: Refuse generated source drift
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record candidate identity
        if: always()
        shell: bash
        run: |
          {
            echo "## Product candidate validation"
            echo "- Commit: \`${{ inputs['expected-sha'] }}\`"
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo "- Domain from tracked config: \`dotify-test01.dot\`"
            echo "- App version: \`${{ steps.product-identity.outputs.app-version }}\`"
            echo "- Signing authority: \`none\`"
            echo "- Network writes: \`none\`"
          } >> "$GITHUB_STEP_SUMMARY"
