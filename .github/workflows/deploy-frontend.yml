name: Deploy Product candidate to DotNS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Product bundle profile to publish
        type: choice
        required: true
        default: validation
        options:
          - validation
          - release
      expected-sha:
        description: Full commit SHA that must be checked out and embedded
        type: string
        required: true
      confirm-domain:
        description: Type dotify-test01.dot to confirm the target
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-product-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs['expected-sha'] }}

      - name: Verify deployment authority and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs['confirm-domain'] }}" = "dotify-test01.dot"
          test -n "${MNEMONIC:-}"
          test "$(git rev-parse HEAD)" = "${{ inputs['expected-sha'] }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Validate candidate
        working-directory: web
        run: |
          npm run test:unit
          npm run smoke:production-env
          npm run smoke:devnet
          npm run smoke:product-journey -- --md-out /tmp/product-journey.md --json-out /tmp/product-journey.json

      - name: Publish validation profile
        if: inputs.profile == 'validation'
        working-directory: web
        env:
          VITE_DOTIFY_RUNTIME_ADAPTER: product-cdm
          VITE_DOTIFY_ARTIST_DONATIONS: on
          VITE_DOTIFY_DEBUG_PANEL: 'true'
        run: npm run deploy:product-devnet

      - name: Publish release profile
        if: inputs.profile == 'release'
        working-directory: web
        run: npm run deploy:product-devnet

      - name: Record candidate identity
        if: always()
        shell: bash
        run: |
          {
            echo "## Product candidate"
            echo "- Commit: \`${{ inputs['expected-sha'] }}\`"
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo "- Domain: \`dotify-test01.dot\`"
            echo "- App version: \`[0, 1, 26]\`"
          } >> "$GITHUB_STEP_SUMMARY"
