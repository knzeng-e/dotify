name: Dev Quality Gates

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-quality-gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    name: W01 / Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint workflow files
        run: actionlint -color

  repository-hygiene:
    name: W01 / Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check backlog manifest
        run: node scripts/backlog-sync.mjs --check --offline

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  web:
    name: W01 / Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: First-sound evidence tests
        run: npm run test:first-sound-readiness

      - name: Celerity offline feasibility tests
        run: npm run test:celerity-feasibility

      - name: Celerity paired capture tests
        run: npm run test:celerity-capture

      - name: Product deployment guard tests (offline)
        run: npm run test:product-deploy-environment

      - name: Build
        run: npm run build

      - name: Production environment guard smoke
        run: npm run smoke:production-env

  signaling:
    name: W01 / Signaling tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run signaling tests
        run: npm run test:signal

  shared-api-state:
    name: W36 / Shared API state and recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dotify_test
          POSTGRES_PASSWORD: local-ci-fixture
          POSTGRES_DB: dotify_w36_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dotify_test -d dotify_w36_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Use matching PostgreSQL 16 backup tools
        run: |
          tool_dir="$RUNNER_TEMP/dotify-pg-tools"
          mkdir -p "$tool_dir" "$RUNNER_TEMP/dotify-w36"
          for tool in pg_dump pg_restore; do
            cat > "$tool_dir/$tool" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host --user "$(id -u):$(id -g)"             --volume "$RUNNER_TEMP/dotify-w36:$RUNNER_TEMP/dotify-w36"             postgres:16 "$(basename "$0")" "$@"
          SCRIPT
            chmod +x "$tool_dir/$tool"
          done
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Two API processes, outages, migration and backup restore
        env:
          TEST_DATABASE_URL: postgresql://dotify_test:local-ci-fixture@127.0.0.1:5432/dotify_w36_test
          TMPDIR: ${{ runner.temp }}/dotify-w36
        run: npm run test:shared-state

  api:
    name: W01 / API tests and typecheck
    # Keep codec-fixture tooling reproducible across ubuntu-latest migrations.
    # The 26.04 image stalled for 10+ minutes downloading ffmpeg from Azure.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Streaming codec and nonce round-trip
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffmpeg -L
          DOTIFY_TEST_FFMPEG="$(command -v ffmpeg)" npm run test:streaming

      - name: Generate synthetic encrypted browser fixture
        run: DOTIFY_TEST_FFMPEG="$(command -v ffmpeg)" node --import tsx src/scripts/streamingFixture.test.ts "${GITHUB_WORKSPACE}/web/.data/streaming-fixture.json"

      - name: Retain synthetic codec fixture
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-streaming-fixture
          path: web/.data/streaming-fixture.json
          include-hidden-files: true
          retention-days: 3

  api-storage-rehearsal:
    name: W30 / Non-root storage rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rehearse isolated volume migration and rollback
        run: npm --prefix services/api run storage:rehearse

  streaming-worker-rehearsal:
    name: W32 / Isolated encoding publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated encoder, custody and publication
        run: npm --prefix services/api run streaming:rehearse

  evm-contracts:
    name: W01 / EVM contracts and ABI drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/evm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt:check

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Regenerate ABI bindings
        run: npm run generate:abis

      - name: Fail on ABI drift
        working-directory: .
        run: |
          drift="$(git status --porcelain -- web/src/generated/contracts)"
          if [ -n "${drift}" ]; then
            printf '%s\n' "${drift}"
            git diff -- web/src/generated/contracts
            exit 1
          fi

  product-devnet-build:
    name: W01 / Product DevNet build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Product catalog bootstrap from fixture
        run: npm run generate:product-catalog-bootstrap:strict -- --input fixtures/product-devnet-catalog.json

      - name: Build Product DevNet package
        env:
          # Keep the build itself offline after the strict fixture generation.
          CATALOG_API_URL: http://127.0.0.1:9
        run: npm run build:product-devnet

      - name: Build native Product support profile
        env:
          VITE_DOTIFY_RUNTIME_ADAPTER: product-cdm
          VITE_DOTIFY_ARTIST_DONATIONS: 'on'
        run: npx vite build --config vite.product.config.ts --mode product-devnet

      - name: Build opt-in Celerity observation profile
        env:
          VITE_DOTIFY_ROOM_REALTIME: dual
        run: npx vite build --config vite.product.config.ts --mode product-devnet

      - name: Build Nearby operational rollback profile
        env:
          VITE_DOTIFY_NEARBY: 'off'
        run: npx vite build --config vite.product.config.ts --mode product-devnet

      - name: Fail on generated Product catalog drift
        working-directory: .
        run: |
          drift="$(git status --porcelain -- web/src/services/productDevnetCatalogBootstrap.ts)"
          if [ -n "${drift}" ]; then
            printf '%s\n' "${drift}"
            git diff -- web/src/services/productDevnetCatalogBootstrap.ts
            exit 1
          fi

  playwright:
    name: W01 / Playwright core flows
    # Match the stable codec runner for browser system dependency installation.
    runs-on: ubuntu-24.04
    needs: api
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit firefox

      # Nearby verifies decoded WebRTC energy through a real AudioContext, just
      # like the three-engine streaming gate. Give both jobs an audio clock.
      - name: Start a real audio service with a headless output
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dotify_ci_audio
          pactl set-default-sink dotify_ci_audio
          pactl info

      - name: Fetch synthetic codec fixture from this commit
        uses: actions/download-artifact@v4
        with:
          name: synthetic-streaming-fixture
          path: web/.data

      - name: Run deterministic core flows
        run: npm run test:e2e

      - name: Verify default Web and Product Nearby discovery
        run: npm run test:nearby

      - name: Verify Nearby operational rollback
        run: npm run test:e2e -- --config playwright.nearby-off.config.ts


      - name: Verify encrypted audio continuity
        run: npm run test:audio-continuity -- --project chromium

      - name: Verify Product host identity
        working-directory: web
        run: npx playwright test --config playwright.product-identity.config.ts --project=chromium --workers=2

      - name: Verify incomplete sign-out recovery
        working-directory: web
        run: npx playwright test --config playwright.session-logout.config.ts --project=chromium --workers=2

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_attempt }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  streaming-browser:
    name: W35 / Adaptive streaming in three engines
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install three browser engines
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Start a real audio service with a headless output
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dotify_ci_audio
          pactl set-default-sink dotify_ci_audio
          pactl info

      - name: Fetch synthetic codec fixture from this commit
        uses: actions/download-artifact@v4
        with:
          name: synthetic-streaming-fixture
          path: web/.data

      - name: Verify authenticated streaming and rendition changes
        run: npx playwright test --config playwright.streaming.config.ts

      - name: Preserve streaming failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-browser-failures-${{ github.run_attempt }}
          path: web/.data/streaming-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
